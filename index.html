<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>冰箱里有啥？帮你想菜！</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
      background: #f7f3ee;
      color: #333;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      color: white;
      padding: 20px 24px 16px;
      text-align: center;
    }
    header h1 { font-size: 1.6rem; font-weight: 700; }
    header p { font-size: 0.85rem; opacity: 0.9; margin-top: 4px; }

    .container { max-width: 680px; margin: 0 auto; padding: 16px; }

    /* API Key */
    .api-section {
      background: #fff8f0;
      border: 1.5px solid #ffd6b0;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .api-section label { font-size: 0.82rem; color: #888; display: block; margin-bottom: 6px; }
    .api-row { display: flex; gap: 8px; }
    .api-row input {
      flex: 1;
      border: 1.5px solid #e0d8d0;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
      background: white;
    }
    .api-row input:focus { outline: none; border-color: #ff6b35; }
    .btn-save {
      background: #ff6b35;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-save:hover { background: #e55a26; }
    .api-status { font-size: 0.78rem; margin-top: 6px; }
    .api-status.ok { color: #4caf50; }
    .api-status.empty { color: #aaa; }

    /* Ingredient categories */
    .section-title {
      font-size: 1rem;
      font-weight: 600;
      color: #555;
      margin: 16px 0 10px;
    }

    .category {
      background: white;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .category-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: #999;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1.5px solid #e0d8d0;
      border-radius: 20px;
      padding: 5px 13px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.15s;
      background: white;
      user-select: none;
    }
    .chip:hover { border-color: #ff6b35; color: #ff6b35; }
    .chip.selected {
      background: #ff6b35;
      border-color: #ff6b35;
      color: white;
    }

    /* Custom ingredient */
    .custom-section {
      background: white;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .custom-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .custom-row input {
      flex: 1;
      border: 1.5px solid #e0d8d0;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.9rem;
    }
    .custom-row input:focus { outline: none; border-color: #ff6b35; }
    .btn-add {
      background: #f0f0f0;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      color: #555;
    }
    .btn-add:hover { background: #e0e0e0; }

    /* Selected summary */
    .selected-bar {
      background: #fff8f0;
      border: 1.5px dashed #ffb87a;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 0.85rem;
      color: #a05a20;
      min-height: 40px;
    }
    .selected-bar span { font-weight: 600; }

    /* Generate button */
    .btn-generate {
      width: 100%;
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 20px;
    }
    .btn-generate:hover { opacity: 0.9; }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Result */
    .result-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      display: none;
    }
    .result-card.visible { display: block; }
    .result-card h2 {
      font-size: 1.15rem;
      color: #ff6b35;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1.5px solid #f0ebe4;
    }
    .result-content {
      font-size: 0.92rem;
      line-height: 1.8;
      color: #444;
      white-space: pre-wrap;
    }
    .result-content strong { color: #333; }

    /* Loading */
    .loading {
      text-align: center;
      padding: 24px;
      color: #aaa;
      font-size: 0.9rem;
      display: none;
    }
    .loading.visible { display: block; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #f0ebe4;
      border-top-color: #ff6b35;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-msg {
      background: #fff0f0;
      border: 1.5px solid #ffb0b0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.88rem;
      color: #c00;
      margin-bottom: 14px;
      display: none;
    }
    .error-msg.visible { display: block; }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #bbb;
      padding: 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>🍳 冰箱里有啥？帮你想菜！</h1>
  <p>选好食材，AI 帮你出菜谱</p>
</header>

<div class="container">

  <!-- API Key -->
  <div class="api-section">
    <label>Anthropic API Key（用于 AI 生成食谱，仅存在本地浏览器中）</label>
    <div class="api-row">
      <input type="password" id="apiKeyInput" placeholder="sk-ant-..." />
      <button class="btn-save" onclick="saveApiKey()">保存</button>
    </div>
    <div class="api-status empty" id="apiStatus">未设置 API Key</div>
  </div>

  <div class="section-title">📦 选择你有的食材</div>

  <!-- Categories -->
  <div id="categoriesContainer"></div>

  <!-- Custom ingredient -->
  <div class="custom-section">
    <div class="section-title" style="margin-top:0">✏️ 手动添加食材</div>
    <div class="custom-row">
      <input type="text" id="customInput" placeholder="如：豆腐、排骨..." onkeydown="if(event.key==='Enter')addCustom()" />
      <button class="btn-add" onclick="addCustom()">添加</button>
    </div>
    <div class="chips" id="customChips"></div>
  </div>

  <!-- Selected summary -->
  <div class="selected-bar" id="selectedBar">还没有选食材，点上面的选一些吧～</div>

  <!-- Preference row -->
  <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
    <div style="flex:1;min-width:140px">
      <div style="font-size:0.82rem;color:#888;margin-bottom:5px">菜系偏好</div>
      <select id="cuisinePref" style="width:100%;border:1.5px solid #e0d8d0;border-radius:8px;padding:7px 10px;font-size:0.88rem;background:white">
        <option value="">不限</option>
        <option value="家常菜">家常菜</option>
        <option value="川菜">川菜（辣）</option>
        <option value="粤菜">粤菜（清淡）</option>
        <option value="东北菜">东北菜</option>
        <option value="江浙菜">江浙菜</option>
      </select>
    </div>
    <div style="flex:1;min-width:140px">
      <div style="font-size:0.82rem;color:#888;margin-bottom:5px">人数</div>
      <select id="servingsPref" style="width:100%;border:1.5px solid #e0d8d0;border-radius:8px;padding:7px 10px;font-size:0.88rem;background:white">
        <option value="1">1 人</option>
        <option value="2" selected>2 人</option>
        <option value="3">3～4 人</option>
        <option value="5">5 人以上</option>
      </select>
    </div>
    <div style="flex:1;min-width:140px">
      <div style="font-size:0.82rem;color:#888;margin-bottom:5px">菜谱数量</div>
      <select id="countPref" style="width:100%;border:1.5px solid #e0d8d0;border-radius:8px;padding:7px 10px;font-size:0.88rem;background:white">
        <option value="1">1 道菜</option>
        <option value="2" selected>2 道菜</option>
        <option value="3">3 道菜</option>
      </select>
    </div>
  </div>

  <button class="btn-generate" id="generateBtn" onclick="generateRecipes()">✨ 帮我想菜谱！</button>

  <div class="error-msg" id="errorMsg"></div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    AI 正在思考你的菜谱，稍等一下...
  </div>
  <div class="result-card" id="resultCard">
    <h2>🍽️ 今天可以做这些！</h2>
    <div class="result-content" id="resultContent"></div>
  </div>

</div>

<footer>食材选好，开火做饭～ | Powered by Claude AI</footer>

<script>
const INGREDIENTS = [
  {
    name: "🥩 肉类",
    items: ["猪肉", "牛肉", "鸡肉", "羊肉", "猪排", "鸡腿", "鸡胸肉", "五花肉", "培根", "火腿"]
  },
  {
    name: "🐟 海鲜",
    items: ["虾", "鱼", "螃蟹", "蛤蜊", "鱿鱼", "扇贝", "鲈鱼", "带鱼", "鲫鱼"]
  },
  {
    name: "🥚 蛋奶豆",
    items: ["鸡蛋", "豆腐", "豆腐干", "牛奶", "奶酪", "皮蛋", "咸蛋"]
  },
  {
    name: "🥦 蔬菜",
    items: ["土豆", "番茄", "茄子", "辣椒", "青椒", "洋葱", "大葱", "白菜", "菠菜", "生菜", "西兰花", "胡萝卜", "黄瓜", "冬瓜", "南瓜", "芹菜", "韭菜", "莲藕", "蘑菇", "木耳"]
  },
  {
    name: "🌾 主食/粮食",
    items: ["大米", "面条", "馒头", "玉米", "红薯", "粉丝", "年糕", "饺子皮"]
  },
  {
    name: "🧄 调料/常备",
    items: ["大蒜", "姜", "葱", "酱油", "醋", "豆瓣酱", "番茄酱", "蚝油", "料酒", "花椒", "八角"]
  }
];

let selectedIngredients = new Set();
let customIngredients = [];

function init() {
  const container = document.getElementById('categoriesContainer');
  INGREDIENTS.forEach(cat => {
    const div = document.createElement('div');
    div.className = 'category';
    div.innerHTML = `<div class="category-name">${cat.name}</div><div class="chips">${
      cat.items.map(item => `<div class="chip" onclick="toggleIngredient('${item}', this)">${item}</div>`).join('')
    }</div>`;
    container.appendChild(div);
  });

  const saved = localStorage.getItem('anthropic_api_key');
  if (saved) {
    document.getElementById('apiKeyInput').value = saved;
    document.getElementById('apiStatus').textContent = '✅ API Key 已设置';
    document.getElementById('apiStatus').className = 'api-status ok';
  }
}

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) return;
  localStorage.setItem('anthropic_api_key', key);
  document.getElementById('apiStatus').textContent = '✅ API Key 已保存';
  document.getElementById('apiStatus').className = 'api-status ok';
}

function toggleIngredient(name, el) {
  if (selectedIngredients.has(name)) {
    selectedIngredients.delete(name);
    el.classList.remove('selected');
  } else {
    selectedIngredients.add(name);
    el.classList.add('selected');
  }
  updateSummary();
}

function addCustom() {
  const input = document.getElementById('customInput');
  const val = input.value.trim();
  if (!val) return;
  const items = val.split(/[,，、\s]+/).filter(Boolean);
  items.forEach(item => {
    if (!customIngredients.includes(item)) {
      customIngredients.push(item);
      selectedIngredients.add(item);
      renderCustomChips();
    }
  });
  input.value = '';
  updateSummary();
}

function removeCustom(name) {
  customIngredients = customIngredients.filter(i => i !== name);
  selectedIngredients.delete(name);
  renderCustomChips();
  updateSummary();
}

function renderCustomChips() {
  const container = document.getElementById('customChips');
  container.innerHTML = customIngredients.map(item =>
    `<div class="chip selected" style="cursor:default">${item} <span onclick="removeCustom('${item}')" style="cursor:pointer;opacity:0.7;margin-left:2px">×</span></div>`
  ).join('');
}

function updateSummary() {
  const bar = document.getElementById('selectedBar');
  const all = [...selectedIngredients];
  if (all.length === 0) {
    bar.innerHTML = '还没有选食材，点上面的选一些吧～';
  } else {
    bar.innerHTML = `<span>已选 ${all.length} 种食材：</span>${all.join('、')}`;
  }
}

async function generateRecipes() {
  const key = localStorage.getItem('anthropic_api_key') || document.getElementById('apiKeyInput').value.trim();
  if (!key) {
    showError('请先填写并保存你的 Anthropic API Key ↑');
    return;
  }
  const ingredients = [...selectedIngredients];
  if (ingredients.length === 0) {
    showError('请至少选一种食材！');
    return;
  }

  const cuisine = document.getElementById('cuisinePref').value;
  const servings = document.getElementById('servingsPref').value;
  const count = document.getElementById('countPref').value;

  const prompt = `我冰箱里现在有这些食材：${ingredients.join('、')}。
请根据这些食材，帮我设计 ${count} 道适合 ${servings} 人吃的${cuisine ? cuisine : '家常'}菜谱。
要求：
1. 只使用我提供的食材（调料可以假设家里有常用的）
2. 步骤要详细、清晰，适合普通人在家操作
3. 每道菜包含：菜名、所需食材和用量、详细烹饪步骤
4. 用中文回答，格式整洁，步骤用数字编号`;

  hideError();
  document.getElementById('loading').classList.add('visible');
  document.getElementById('resultCard').classList.remove('visible');
  document.getElementById('generateBtn').disabled = true;
  document.getElementById('resultContent').textContent = '';

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-request-override': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 2048,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `请求失败 (${resp.status})`);
    }

    const data = await resp.json();
    const text = data.content?.[0]?.text || '没有生成结果，请重试';

    document.getElementById('resultContent').textContent = text;
    document.getElementById('resultCard').classList.add('visible');
    document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch (e) {
    showError('生成失败：' + e.message + '\n\n提示：如果是跨域错误，请确认 API Key 正确，或尝试关闭浏览器的跨域限制（部分浏览器会拦截直接调用 API）。');
  } finally {
    document.getElementById('loading').classList.remove('visible');
    document.getElementById('generateBtn').disabled = false;
  }
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('visible');
}
function hideError() {
  document.getElementById('errorMsg').classList.remove('visible');
}

init();
</script>
</body>
</html>
